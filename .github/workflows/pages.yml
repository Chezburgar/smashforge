name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Regenerate the Orion logo
        run: node tools/make-orion-logo.js > orion/assets/orion-logo.svg

      - name: Check for uncommitted logo drift
        run: git diff --exit-code -- orion/assets/orion-logo.svg

      - name: Syntax-check the JavaScript
        run: |
          for f in $(git ls-files '*.js'); do node --check "$f"; done

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
